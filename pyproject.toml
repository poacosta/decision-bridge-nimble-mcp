[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "decision-bridge-nimble-mcp"
dynamic = ["version"]
description = "MCP server and CLI that ask a local Nimble model, through Ollama, for typed decisions."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pedro Acosta" }]
keywords = ["mcp", "ollama", "nimble", "classification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://github.com/poacosta/decision-bridge-nimble-mcp"
Source = "https://github.com/poacosta/decision-bridge-nimble-mcp"
Issues = "https://github.com/poacosta/decision-bridge-nimble-mcp/issues"
Changelog = "https://github.com/poacosta/decision-bridge-nimble-mcp/blob/main/CHANGELOG.md"

[project.scripts]
decision-bridge = "decision_bridge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "jsonschema>=4",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
  "trove-classifiers>=2026.9.21.13",
]

[tool.hatch.version]
path = "src/decision_bridge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_bridge"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/docs", "/scripts", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock", "/LICENSE"]
exclude = ["/.superpowers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not live and not packaging'"
markers = [
  "live: needs a running Ollama with the model installed; set DECISION_BRIDGE_LIVE=1",
  "packaging: builds and installs distributions (slower)",
]
